bind=SUPER,o,incnmaster,-1
bind=SUPER,a,togglegaps
bind=SUPER,x,incgaps, -3
bind=SUPER,z,incgaps, +3

bind=SUPER,1,view,1
bind=SUPER,2,view,2
bind=SUPER,3,view,3
bind=SUPER,4,view,4
bind=SUPER,5,view,5
bind=SUPER,6,view,6
bind=SUPER,7,view,7
bind=SUPER,8,view,8
bind=SUPER,9,view,9
