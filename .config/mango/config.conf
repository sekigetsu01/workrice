bind=NONE,XF86MonBrightnessUp,spawn,brightnessctl s +10%+
bind=NONE,XF86MonBrightnessDown,spawn,brightnessctl s 10%-
bind=SUPER,Up,spawn,brightnessctl s +10%+
bind=SUPER,Down,spawn,brightnessctl s 10%-
bind=SUPER,Right,spawn,~/.local/bin/night-mode up
bind=SUPER,Left,spawn,~/.local/bin/night-mode down

bind=NONE,XF86AudioRaiseVolume,spawn,wpctl set-volume -l 1.5 @DEFAULT_SINK@ 5%+
bind=NONE,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_SINK@ 5%-
bind=NONE,XF86AudioMute,spawn,~/.config/mango/scripts/once mute wpctl set-mute @DEFAULT_SINK@ toggle
bind=NONE,XF86AudioPlay,spawn,~/.config/mango/scripts/once pause-all ~/.config/mango/scripts/pause-all
bind=NONE,XF86AudioNext,spawn,playerctl next
bind=NONE,XF86AudioPrev,spawn,playerctl previous
bind=SUPER,period,spawn,wpctl set-volume -l 1.5 @DEFAULT_SINK@ 5%+
bind=SUPER,comma,spawn,wpctl set-volume @DEFAULT_SINK@ 5%-
bind=SUPER,m,spawn,~/.config/mango/scripts/once mute wpctl set-mute @DEFAULT_SINK@ toggle
bind=SUPER,equal,spawn,~/.config/mango/scripts/opacity up
bind=SUPER+SHIFT,plus,spawn,~/.config/mango/scripts/opacity up
bind=SUPER,minus,spawn,~/.config/mango/scripts/opacity reset
bind=SUPER+SHIFT,m,spawn,~/.config/mango/scripts/once pause-all ~/.config/mango/scripts/pause-all
