# MangoWM, the window manager: what starts with the desktop, looks, window rules and every key (Super / Alt + …)
# QT_SCALE_FACTOR: size of the bar and panels
exec_once=rm -f "$XDG_RUNTIME_DIR/qs-locked"; QT_SCALE_FACTOR=1.25 quickshell -p ~/.config/quickshell >/dev/null 2>&1 &
exec_once=/usr/bin/kitty -1 --start-as=hidden
exec_once=~/.config/mango/scripts/mm track
exec_once=~/.config/mango/scripts/mm attention
exec_once=~/.local/bin/settimes --apply
exec_once=~/.local/bin/wallpaper warm
exec_once=wl-paste --type text --watch ~/.config/mango/scripts/clean-links
exec_once=~/.config/mango/scripts/autoscale

repeat_rate=90
repeat_delay=180
numlock_on=1
xkb_rules_layout=gb
# Caps Lock is another Esc (the host and the VMs have it too)
xkb_rules_options=caps:escape

trackpad_accel_speed=0.2
mouse_accel_speed=0.2
# scroll direction: 1 natural, 0 traditional
trackpad_natural_scrolling=1
mouse_natural_scrolling=0
enable_hotarea=0

source_optional=~/.cache/wal/colors.conf

blur=1
blur_params_radius=4
blur_optimized=1

layer_animations=1

animation_type_open=slide
animation_type_close=slide
layer_animation_type_open=slide
layer_animation_type_close=slide

animation_fade_in=0
animation_fade_out=0

animation_duration_move=400
animation_duration_open=300
animation_duration_close=200

gap_inner_vertical=1
gap_inner_horizontal=2
gap_outer_vertical=2
gap_outer_horizontal=1
border_px=3
border_radius=2

default_master_factor=0.58
cursor_hide_timeout=1
sloppy_focus=1
warp_cursor=1
drag_tile_to_tile=1
axis_bind_apply_timeout=30
focus_on_activate=0

allow_tearing=1

layer_rule=no_animation:1,layer_name:quickshell
window_rule=is_floating:1,animation_type_open:none,animation_type_close:none,width:1344,height:756,app_id:kp
window_rule=is_floating:1,animation_type_open:none,animation_type_close:none,is_overlay:1,width:1064,height:448,app_id:qs-capture
window_rule=is_floating:1,animation_type_open:none,animation_type_close:none,is_overlay:1,width:1204,height:672,app_id:notepad
window_rule=is_floating:1,animation_type_open:none,animation_type_close:none,is_overlay:1,width:1204,height:672,app_id:reminders
window_rule=is_floating:1,animation_type_open:none,animation_type_close:none,width:896,height:420,app_id:clicker
window_rule=is_floating:1,animation_type_open:none,animation_type_close:none,width:720,height:120,app_id:mpv-audio
window_rule=is_floating:1,animation_type_open:none,animation_type_close:none,width:1260,height:616,app_id:speak
window_rule=is_floating:1,no_animation:1,animation_type_open:none,animation_type_close:none,width:1372,height:700,app_id:books
window_rule=is_floating:1,animation_type_open:none,animation_type_close:none,width:1372,height:700,app_id:books-popup
window_rule=tags:9,is_open_silent:1,is_tag_silent:1,app_id:vpn
window_rule=no_animation:1,app_id:swayimg
window_rule=is_floating:1,is_overlay:1,no_animation:1,width:1180,height:720,app_id:iopaint
window_rule=is_floating:1,animation_type_open:none,animation_type_close:none,width:1008,height:280,app_id:passprompt
window_rule=is_floating:1,animation_type_open:none,animation_type_close:none,width:1260,height:644,app_id:bookset-link
window_rule=is_floating:1,animation_type_open:none,animation_type_close:none,width:784,height:280,app_id:bookset-ask

bind=SUPER+ALT+SHIFT,r,reload_config
bind=SUPER,q,killclient,
bind=SUPER,BackSpace,spawn,~/.config/mango/scripts/once powermenu qs ipc call powermenu toggle

bind=SUPER,d,spawn,~/.config/mango/scripts/once applauncher qs ipc call applauncher toggle
bind=SUPER,grave,spawn,~/.config/mango/scripts/once emoji qs ipc call emojipicker toggle
bind=SUPER,p,spawn,~/.config/mango/scripts/once screenshot qs ipc call screenshotter toggle
bind=SUPER,apostrophe,spawn,~/.config/mango/scripts/once calc qs ipc call calc toggle
bind=SUPER,F3,spawn,~/.config/mango/scripts/once timezone qs ipc call timezone toggle
bind=SUPER,c,spawn,~/.config/mango/scripts/once calendar qs ipc call calendar toggle
bind=ALT,r,spawn,~/.config/mango/scripts/once remind ~/.local/bin/remind
bind=ALT,a,spawn,~/.config/mango/scripts/once plan ~/.config/quickshell/calendar/cal todo-edit
bind=ALT,BackSpace,spawn,qs ipc call notifications dismiss
bind=CTRL+ALT,l,spawn,qs ipc call lockscreen lock
bind=SUPER+SHIFT,n,spawn,~/.config/mango/scripts/once notifications qs ipc call notifications toggle
bind=SUPER+SHIFT,s,spawn,~/.config/mango/scripts/once wallpapers qs ipc call wallpaperSelector toggle
bind=ALT,i,spawn,~/.config/mango/scripts/once capture qs ipc call capture toggle

bind=SUPER,Return,spawn,kitty
bind=SUPER,w,spawn,~/.local/bin/glide-bin
bind=SUPER,r,spawn,kitty yazi
bind=SUPER,s,spawn,sioyek --new-window
bind=ALT+SHIFT,s,spawn,~/.config/mango/scripts/once bookset ~/.local/bin/bookset recent
bind=SUPER,e,spawn,thunderbird
bind=SUPER,n,spawn,kitty nvim -c VimwikiIndex
bind=SUPER,v,spawn,~/.config/mango/scripts/raise vesktop vesktop
bind=SUPER+SHIFT,o,spawn,libreoffice --writer
bind=SUPER,f,togglemaximizescreen,
bind=SUPER+ALT,f,togglefullscreen,
bind=SUPER+SHIFT,f,spawn,flatpak run io.freetubeapp.FreeTube --new-window
bind=SUPER+SHIFT,r,spawn,kitty btop
bind=SUPER,F4,spawn,kitty wiremix
bind=SUPER,F5,spawn,qs ipc call wifi toggle
bind=SUPER+SHIFT,d,spawn,~/.config/mango/scripts/once kp ~/.local/bin/kp toggle
bindp=CTRL,v,spawn,~/.local/bin/kp --pasted
bindp=CTRL+SHIFT,v,spawn,~/.local/bin/kp --pasted
bindp=SHIFT,Insert,spawn,~/.local/bin/kp --pasted
bind=ALT,b,spawn,~/.config/mango/scripts/once books ~/.local/bin/books
bind=ALT,m,spawn,~/.config/mango/scripts/once accounting kitty nvim ~/sync/documents/Accounting/money.txt

bind=SUPER,b,spawn,~/.local/bin/wallpaper
bind=SUPER,u,spawn,~/.config/mango/scripts/once vpn ~/.local/bin/vpn
bind=SUPER,F1,spawn,~/.config/mango/scripts/once rec ~/.local/bin/record-screen
bind=SUPER+SHIFT,F1,spawn,~/.config/mango/scripts/once rec ~/.local/bin/record-screen -r
bind=SUPER+CTRL,F1,spawn,~/.config/mango/scripts/once rec ~/.local/bin/record-screen -s
bind=SUPER,F2,spawn,~/.config/mango/scripts/once recp ~/.local/bin/record-screen -p
bind=SUPER,F6,spawn,~/.config/mango/scripts/once clicker ~/.local/bin/clicker
bind=SUPER+SHIFT,F6,spawn,~/.config/mango/scripts/once clickers ~/.local/bin/clicker speed
bind=SUPER,F9,spawn,~/.config/mango/scripts/guide
bind=SUPER,F10,spawn,~/.config/mango/scripts/once clickrec ~/.local/bin/clicker record
bind=SUPER,F11,spawn,~/.config/mango/scripts/once clickpick ~/.local/bin/clicker pick
bind=SUPER+SHIFT,F11,spawn,~/.config/mango/scripts/once clickplay ~/.local/bin/clicker play
bind=ALT,p,spawn,~/.config/mango/scripts/once pomo ~/.local/bin/pomo
bind=ALT+SHIFT,p,spawn,~/.local/bin/pomo reset

# windows
bind=SUPER,j,spawn,~/.config/mango/scripts/mm step next
bind=SUPER,k,spawn,~/.config/mango/scripts/mm step prev
bind=SUPER+SHIFT,h,spawn,~/.config/mango/scripts/calc-or shift-h exchange_client,left
bind=SUPER+SHIFT,j,spawn,~/.config/mango/scripts/calc-or shift-j exchange_client,down
bind=SUPER+SHIFT,k,spawn,~/.config/mango/scripts/calc-or shift-k exchange_client,up
bind=SUPER+SHIFT,l,spawn,~/.config/mango/scripts/calc-or shift-l exchange_client,right
bind=SUPER,l,spawn,~/.config/mango/scripts/mm resize +50 +0
bind=SUPER,h,spawn,~/.config/mango/scripts/mm resize -50 +0
bind=SUPER,space,spawn,~/.config/mango/scripts/calc-or space zoom
bind=SUPER,t,setlayout,tile
bind=SUPER+SHIFT,t,setlayout,vertical_tile
bind=SUPER+SHIFT,c,setlayout,grid
