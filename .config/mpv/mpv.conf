# mpv, the video player: software output, YouTube quality and English subtitles, the font, and the wallpaper's colours
# software output (no GPU acceleration here)
vo=wlshm
sws-scaler=fast-bilinear
keep-open=yes
ytdl-format=bv*[height<=1080]+ba/b
ytdl-raw-options-append=sub-langs=en.*
ytdl-raw-options-append=write-auto-subs=
# a video opened from a playlist brings the whole playlist
ytdl-raw-options-append=yes-playlist=
slang=en,eng
alang=en,eng
osd-font="JetBrains Mono"
sub-font="JetBrains Mono"
include="~/.cache/wal/mpv-colors.conf"

# a video in a folder plays the folder from there on; a video left partway resumes where you stopped
autocreate-playlist=same
directory-mode=ignore
watch-later-options=start
screenshot-dir=~/Pictures/Screenshots
# buffering: wait up to 10 s of video before playing on
cache-pause-wait=10
