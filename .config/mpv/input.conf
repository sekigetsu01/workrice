# mpv's keys, on top of its own: h l / j k seek, o p speed, c the chapters panel, S screenshot, x zoom out …
l seek 20
h seek -20
j seek -60
k seek 60
S screenshot
o add speed -0.1
p add speed 0.1
# chapters as a panel down the right
c script-binding playlist/chapters
~ add chapter 1
@ add chapter -1
x add video-zoom -0.25
z add video-zoom 0.25
# q doesn't close the player (Super+q closes windows)
q ignore
Q ignore
- add volume -5
= add volume 5
MBTN_LEFT cycle pause
MBTN_LEFT_DBL ignore
# a: next audio track, s: subtitles on / off
a script-binding tracks/next-audio
s script-binding tracks/toggle-subs
