# Installed to /etc/ly/config.ini by sys-setup (its auto_login lines stay as they are there)

# Clock in the top right corner (strftime format), and the big clock
clock = %Y-%m-%d %H:%M:%S
bigclock = en

# Erase password input on failure
clear_password = true

# Main box margins and input box length
margin_box_h = 6
margin_box_v = 3
input_len = 40
