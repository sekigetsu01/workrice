# Books' keys while it plays (mpv's input.conf format: books runs mpv with ~/.config/books as its config folder)
SPACE cycle pause
RIGHT script-message music-skip arrows 1
LEFT script-message music-skip arrows -1
l script-message music-skip hl 1
h script-message music-skip hl -1
k script-message music-skip jk 1
j script-message music-skip jk -1
n script-binding books/chapter-next
N script-binding books/chapter-prev
J script-binding books/chapter-next
K script-binding books/chapter-prev
[ script-binding books/speed-down
] script-binding books/speed-up
{ script-binding books/speed-down-big
} script-binding books/speed-up-big
BS script-binding books/speed-reset
- add volume -5
= add volume 5
m cycle mute
b script-binding books/mark
B script-binding books/marks
1 script-binding books/mark-1
2 script-binding books/mark-2
3 script-binding books/mark-3
4 script-binding books/mark-4
5 script-binding books/mark-5
6 script-binding books/mark-6
7 script-binding books/mark-7
8 script-binding books/mark-8
9 script-binding books/mark-9
t script-binding books/skip-mark
S script-binding books/skips
e script-binding books/rename
? script-binding books/help
q quit
