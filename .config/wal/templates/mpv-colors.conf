# mpv's on-screen text, subtitle and seek bar colours, made by pywal (mpv.conf includes it; scripts/walcolors.lua reloads it)
osd-color="{foreground}"
osd-border-color="{background}"
sub-color="{foreground}"
sub-border-color="{background}"
script-opts-append="osc-background_color={background}"
script-opts-append="osc-timecode_color={color4}"
script-opts-append="osc-title_color={foreground}"
script-opts-append="osc-time_pos_color={foreground}"
script-opts-append="osc-time_pos_outline_color={background}"
script-opts-append="osc-buttons_color={foreground}"
script-opts-append="osc-small_buttonsL_color={foreground}"
script-opts-append="osc-small_buttonsR_color={foreground}"
script-opts-append="osc-top_buttons_color={foreground}"
script-opts-append="osc-held_element_color={color8}"
